name: ollama-gguf-converter

# Whole stack, including the "Convert from HF" page: redis + web + worker +
# converter. Standalone file (not merged with docker-compose.yml) - run it
# on its own:
#   docker compose -f docker-compose.convert.yml up -d
# It shares the same project name/volumes as docker-compose.yml, so
# switching between the two later reuses the same data.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: ${IMAGE:-ghcr.io/arthur2500/ollama-gguf-converter-webui:latest}
    build: .
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    ports:
      - "${WEB_PORT:-8080}:8000"
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Linux/Docker Engine: host.docker.internal isn't built in like it is on
    # Docker Desktop - map it to the host gateway so OLLAMA_INSTANCES URLs
    # like http://host.docker.internal:11434 resolve to the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: ${IMAGE:-ghcr.io/arthur2500/ollama-gguf-converter-webui:latest}
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Not an HTTP server - override the image's default HTTP healthcheck
    # with arq's own Redis health-check key instead.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import os,sys,redis; sys.exit(0 if redis.from_url(os.environ['REDIS_URL']).exists('gguf_download:health-check') else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  # Converts non-GGUF Hugging Face repos to GGUF before importing. Separate
  # image (llama.cpp + torch/transformers, ~1-1.5GB) - only built/pulled
  # when you run this file.
  converter:
    image: ${CONVERTER_IMAGE:-ghcr.io/arthur2500/ollama-gguf-converter-webui-converter:latest}
    build:
      context: .
      dockerfile: Dockerfile.converter
    command: ["arq", "app.converter_worker.WorkerSettings"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import os,sys,redis; sys.exit(0 if redis.from_url(os.environ['REDIS_URL']).exists('hf_convert:health-check') else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Conversion holds model weights in RAM and is CPU-bound; give it real
    # resources if your machine has them, e.g.:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 16g

volumes:
  redis-data:
  app-data:
