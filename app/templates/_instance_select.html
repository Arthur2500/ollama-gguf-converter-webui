{# expects: instances #}
<label>Target Ollama instance
  <select name="instance" id="instance-select" required>
    {% for i in instances %}
    <option value="{{ i.name }}" data-base-label="{{ i.name }} &mdash; {{ i.url }}">{{ i.name }} &mdash; {{ i.url }}</option>
    {% endfor %}
  </select>
</label>
