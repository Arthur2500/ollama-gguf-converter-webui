<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ollama GGUF Converter{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body{% block body_attrs %}{% endblock %}>
  <header class="topbar">
    <div class="topbar-left">
      <a href="/" class="brand">GGUF&nbsp;&rarr;&nbsp;Ollama</a>
      {% if authed %}
      <nav class="tabs">
        <a href="/" class="tab {{ 'tab-active' if active == 'gguf' }}">GGUF</a>
        <a href="/convert" class="tab {{ 'tab-active' if active == 'convert' }}">Convert from HF</a>
      </nav>
      {% endif %}
    </div>
    {% if authed %}<a href="/logout" class="link">Log out</a>{% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
