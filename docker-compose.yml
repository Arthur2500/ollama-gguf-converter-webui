name: ollama-gguf-converter

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: ${IMAGE:-ghcr.io/arthur25/ollama-gguf-converter-webui:latest}
    build: .
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    ports:
      - "${WEB_PORT:-8080}:8000"
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${IMAGE:-ghcr.io/arthur25/ollama-gguf-converter-webui:latest}
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Optional local Ollama. Enable with:  docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  redis-data:
  app-data:
  ollama-data:
