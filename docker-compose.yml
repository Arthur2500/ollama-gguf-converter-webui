name: ollama-gguf-converter

# Default stack: redis + web + worker - just the GGUF-download page.
# For the "Convert from HF" page too, use docker-compose.convert.yml instead
# (a complete, standalone file with the same services plus `converter`):
#   docker compose -f docker-compose.convert.yml up -d

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: ${IMAGE:-ghcr.io/arthur2500/ollama-gguf-converter-webui:latest}
    build: .
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    ports:
      - "${WEB_PORT:-8080}:8000"
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${IMAGE:-ghcr.io/arthur2500/ollama-gguf-converter-webui:latest}
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Not an HTTP server - override the image's default HTTP healthcheck
    # with arq's own Redis health-check key instead.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import os,sys,redis; sys.exit(0 if redis.from_url(os.environ['REDIS_URL']).exists('gguf_download:health-check') else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  redis-data:
  app-data:
